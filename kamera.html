<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>GeoTime Camera</title>

    <!-- Font Awesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Leaflet CSS CDN -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        :root {
            --bg-dark: #0a0a0a;
            --bg-glass: rgba(18, 18, 18, 0.55);
            --bg-glass-light: rgba(22, 22, 22, 0.45);
            --text-soft: rgba(255, 255, 255, 0.88);
            --text-muted: rgba(255, 255, 255, 0.55);
            --text-subtle: rgba(255, 255, 255, 0.7);
            --accent: #5b9bd5;
            --accent-soft: rgba(91, 155, 213, 0.5);
            --accent-glow: rgba(91, 155, 213, 0.25);
            --border-glass: rgba(255, 255, 255, 0.1);
            --border-glass-strong: rgba(255, 255, 255, 0.18);
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.4);
            --shadow-md: 0 4px 20px rgba(0, 0, 0, 0.5);
            --shadow-lg: 0 8px 40px rgba(0, 0, 0, 0.6);
            --radius-sm: 10px;
            --radius-md: 16px;
            --radius-lg: 24px;
            --radius-full: 50%;
            --transition-fast: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            --transition-smooth: 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            --font-mono: 'SF Mono', 'Cascadia Code', 'Consolas', 'Monaco', monospace;
            --font-sans: 'Inter', 'SF Pro Display', system-ui, -apple-system, sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            -webkit-user-select: none;
            user-select: none;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            font-family: var(--font-sans);
            touch-action: manipulation;
            -webkit-overflow-scrolling: none;
            position: fixed;
            top: 0;
            left: 0;
        }

        .app-container {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        .camera-video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            z-index: 1;
            transform: scaleX(1);
            transition: transform var(--transition-smooth);
        }
        .camera-video.front-facing {
            transform: scaleX(-1);
        }

        .dark-overlay {
            position: absolute;
            inset: 0;
            z-index: 2;
            pointer-events: none;
            background: radial-gradient(ellipse at center,
                    transparent 40%,
                    rgba(0, 0, 0, 0.15) 70%,
                    rgba(0, 0, 0, 0.35) 100%);
        }

        .status-bar-top {
            position: absolute;
            top: 16px;
            left: 16px;
            z-index: 10;
            display: flex;
            flex-direction: row;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }
        .status-chip {
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 6px 10px;
            font-size: 10px;
            font-weight: 500;
            letter-spacing: 0.3px;
            color: var(--text-soft);
            background: var(--bg-glass);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-glass);
            border-radius: 20px;
            white-space: nowrap;
            transition: all var(--transition-fast);
            box-shadow: var(--shadow-sm);
        }
        .status-chip i {
            font-size: 9px;
            color: var(--accent);
        }
        .status-chip.online i {
            color: #4caf84;
        }
        .status-chip.offline i {
            color: #e57373;
        }
        .status-chip.gps-active i {
            color: #4caf84;
            animation: gps-pulse 1.8s ease-in-out infinite;
        }
        .status-chip.gps-searching i {
            color: #ffb74d;
            animation: gps-pulse 0.8s ease-in-out infinite;
        }
        .status-chip.gps-denied i {
            color: #e57373;
        }
        .status-chip.battery i {
            color: #81c784;
        }
        .status-chip.battery-low i {
            color: #e57373;
        }

        @keyframes gps-pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .mini-map-wrapper {
            position: absolute;
            top: 16px;
            right: 16px;
            z-index: 10;
            width: 140px;
            height: 140px;
            border-radius: var(--radius-md);
            overflow: hidden;
            border: 1.5px solid var(--border-glass-strong);
            box-shadow: var(--shadow-md);
            background: #1a1a1a;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            transition: all var(--transition-smooth);
        }
        .mini-map-wrapper.loading {
            opacity: 0.6;
        }
        .mini-map-container {
            width: 100%;
            height: 100%;
            border-radius: var(--radius-md);
        }
        .mini-map-container .leaflet-control-zoom,
        .mini-map-container .leaflet-control-attribution {
            display: none;
        }

        .timestamp-panel {
            position: absolute;
            bottom: 130px;
            left: 16px;
            z-index: 10;
            padding: 12px 15px;
            background: var(--bg-glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-md);
            display: flex;
            flex-direction: column;
            gap: 5px;
            max-width: 220px;
            transition: all var(--transition-smooth);
        }
        .timestamp-row {
            display: flex;
            align-items: center;
            gap: 7px;
            font-size: 11px;
            color: var(--text-soft);
            letter-spacing: 0.2px;
            line-height: 1.4;
        }
        .timestamp-row i {
            font-size: 9px;
            width: 14px;
            text-align: center;
            color: var(--accent);
            flex-shrink: 0;
        }
        .timestamp-row .label {
            color: var(--text-muted);
            font-size: 9px;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            min-width: 28px;
            flex-shrink: 0;
        }
        .timestamp-row .value {
            color: var(--text-soft);
            font-weight: 500;
            font-variant-numeric: tabular-nums;
            font-family: var(--font-mono);
            font-size: 10px;
        }
        .timestamp-app-name {
            font-size: 9px;
            color: var(--text-muted);
            letter-spacing: 1.2px;
            text-transform: uppercase;
            margin-top: 2px;
            font-weight: 600;
        }
        .timestamp-location-name {
            font-size: 10px;
            color: var(--text-subtle);
            font-style: italic;
            max-width: 180px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            line-height: 1.3;
        }

        .bottom-controls {
            position: absolute;
            bottom: 28px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            display: flex;
            align-items: center;
            gap: 22px;
            padding: 14px 24px;
            background: var(--bg-glass);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--border-glass);
            border-radius: 40px;
            box-shadow: var(--shadow-lg);
            transition: all var(--transition-smooth);
        }

        .btn-capture {
            width: 72px;
            height: 72px;
            border-radius: var(--radius-full);
            background: transparent;
            border: 4px solid rgba(255, 255, 255, 0.85);
            cursor: pointer;
            position: relative;
            transition: all var(--transition-fast);
            outline: none;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 0 0 var(--accent-glow);
            animation: capture-pulse 3s ease-in-out infinite;
        }
        .btn-capture::after {
            content: '';
            position: absolute;
            inset: 8px;
            border-radius: var(--radius-full);
            background: rgba(255, 255, 255, 0.9);
            transition: all var(--transition-fast);
        }
        .btn-capture:active {
            transform: scale(0.9);
            border-color: var(--accent);
            box-shadow: 0 0 30px var(--accent-glow);
        }
        .btn-capture:active::after {
            inset: 14px;
            background: rgba(255, 255, 255, 0.7);
        }
        @keyframes capture-pulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(255, 255, 255, 0.2); }
            50% { box-shadow: 0 0 0 14px rgba(255, 255, 255, 0); }
        }

        .btn-small {
            width: 44px;
            height: 44px;
            border-radius: var(--radius-full);
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--border-glass-strong);
            cursor: pointer;
            color: var(--text-soft);
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all var(--transition-fast);
            outline: none;
            -webkit-tap-highlight-color: transparent;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }
        .btn-small:active {
            background: rgba(255, 255, 255, 0.2);
            transform: scale(0.88);
            border-color: var(--accent-soft);
            box-shadow: 0 0 16px var(--accent-glow);
        }

        .capture-canvas {
            display: none;
            position: absolute;
            top: -9999px;
            left: -9999px;
            z-index: -1;
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            z-index: 100;
            background: rgba(0, 0, 0, 0.88);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity var(--transition-smooth);
        }
        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }
        .modal-content {
            position: relative;
            max-width: 92vw;
            max-height: 85vh;
            border-radius: var(--radius-lg);
            overflow: hidden;
            box-shadow: var(--shadow-lg);
            border: 1px solid var(--border-glass-strong);
            transform: scale(0.9);
            transition: transform var(--transition-smooth);
            background: #111;
        }
        .modal-overlay.active .modal-content {
            transform: scale(1);
        }
        .modal-content img {
            display: block;
            max-width: 100%;
            max-height: 75vh;
            object-fit: contain;
            border-radius: var(--radius-lg) var(--radius-lg) 0 0;
        }
        .modal-actions {
            display: flex;
            gap: 12px;
            padding: 14px 20px;
            background: rgba(20, 20, 20, 0.9);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            justify-content: center;
            align-items: center;
            border-top: 1px solid var(--border-glass);
        }
        .btn-modal {
            padding: 10px 20px;
            border-radius: 25px;
            border: 1px solid var(--border-glass-strong);
            background: rgba(255, 255, 255, 0.06);
            color: var(--text-soft);
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            letter-spacing: 0.3px;
            display: flex;
            align-items: center;
            gap: 7px;
            transition: all var(--transition-fast);
            outline: none;
            font-family: var(--font-sans);
        }
        .btn-modal:active {
            background: rgba(255, 255, 255, 0.14);
            border-color: var(--accent-soft);
        }
        .btn-modal.download-btn {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
            font-weight: 600;
        }
        .btn-modal.download-btn:active {
            background: #4a8bc5;
            box-shadow: 0 0 24px rgba(91, 155, 213, 0.5);
        }
        .btn-close-modal {
            position: absolute;
            top: 12px;
            right: 12px;
            width: 36px;
            height: 36px;
            border-radius: var(--radius-full);
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid var(--border-glass-strong);
            color: #fff;
            cursor: pointer;
            font-size: 14px;
            z-index: 5;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all var(--transition-fast);
            outline: none;
        }
        .btn-close-modal:active {
            background: rgba(255, 255, 255, 0.2);
            transform: scale(0.85);
        }

        .camera-error {
            position: absolute;
            inset: 0;
            z-index: 20;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 12px;
            color: var(--text-soft);
            background: rgba(0, 0, 0, 0.9);
            text-align: center;
            padding: 30px;
            pointer-events: none;
            opacity: 0;
            transition: opacity var(--transition-smooth);
        }
        .camera-error.visible {
            opacity: 1;
            pointer-events: auto;
        }
        .camera-error i {
            font-size: 48px;
            color: #e57373;
        }

        @media (max-width: 400px) {
            .timestamp-panel { bottom: 115px; left: 8px; padding: 10px 12px; max-width: 185px; }
            .mini-map-wrapper { width: 110px; height: 110px; top: 10px; right: 10px; }
            .bottom-controls { gap: 16px; padding: 10px 18px; bottom: 20px; }
            .btn-capture { width: 60px; height: 60px; }
            .btn-small { width: 38px; height: 38px; }
        }
    </style>
</head>
<body>
<div class="app-container" id="appContainer">
    <video class="camera-video" id="cameraVideo" autoplay playsinline muted></video>
    <div class="dark-overlay"></div>

    <div class="status-bar-top" id="statusBarTop">
        <span class="status-chip online" id="chipInternet"><i class="fa-solid fa-wifi"></i> <span id="txtInternet">Online</span></span>
        <span class="status-chip battery" id="chipBattery"><i class="fa-solid fa-battery-full"></i> <span id="txtBattery">--</span></span>
        <span class="status-chip" id="chipResolution"><i class="fa-solid fa-video"></i> <span id="txtResolution">--</span></span>
        <span class="status-chip" id="chipClock"><i class="fa-regular fa-clock"></i> <span id="txtClock">--:--:--</span></span>
    </div>

    <div class="mini-map-wrapper loading" id="miniMapWrapper">
        <div class="mini-map-container" id="miniMapContainer"></div>
    </div>

    <div class="timestamp-panel" id="timestampPanel">
        <div class="timestamp-row"><i class="fa-regular fa-calendar"></i><span class="label">Tgl</span><span class="value" id="txtDate">--</span></div>
        <div class="timestamp-row"><i class="fa-regular fa-clock"></i><span class="label">Jam</span><span class="value" id="txtTime">--:--:--</span></div>
        <div class="timestamp-row"><i class="fa-solid fa-location-dot"></i><span class="label">Lat</span><span class="value" id="txtLat">--</span></div>
        <div class="timestamp-row"><i class="fa-solid fa-location-dot"></i><span class="label">Lon</span><span class="value" id="txtLon">--</span></div>
        <div class="timestamp-row"><i class="fa-solid fa-crosshairs"></i><span class="label">Akur</span><span class="value" id="txtAccuracy">--</span></div>
        <div class="timestamp-location-name" id="txtLocationName">Mendapatkan lokasi...</div>
        <div class="timestamp-app-name">GeoTime Camera</div>
    </div>

    <div class="bottom-controls">
        <button class="btn-small" id="btnSwitchCamera" title="Tukar Kamera"><i class="fa-solid fa-camera-rotate"></i></button>
        <button class="btn-capture" id="btnCapture" title="Ambil Foto"></button>
        <button class="btn-small" id="btnGpsRefresh" title="Refresh GPS"><i class="fa-solid fa-location-crosshairs"></i></button>
    </div>

    <canvas class="capture-canvas" id="captureCanvas"></canvas>
    <div class="camera-error" id="cameraError"><i class="fa-solid fa-video-slash"></i><p>Tidak dapat mengakses kamera.</p></div>

    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-content" id="modalContent">
            <button class="btn-close-modal" id="btnCloseModal"><i class="fa-solid fa-xmark"></i></button>
            <img id="modalImage" src="" alt="Hasil Capture" />
            <div class="modal-actions">
                <button class="btn-modal" id="btnCloseModal2"><i class="fa-solid fa-xmark"></i> Tutup</button>
                <button class="btn-modal download-btn" id="btnDownload"><i class="fa-solid fa-download"></i> Simpan Foto</button>
            </div>
        </div>
    </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    (function() {
        const cameraVideo = document.getElementById('cameraVideo');
        const captureCanvas = document.getElementById('captureCanvas');
        const ctx = captureCanvas.getContext('2d');
        const modalOverlay = document.getElementById('modalOverlay');
        const modalImage = document.getElementById('modalImage');
        const cameraError = document.getElementById('cameraError');
        const btnCapture = document.getElementById('btnCapture');
        const btnSwitchCamera = document.getElementById('btnSwitchCamera');
        const btnGpsRefresh = document.getElementById('btnGpsRefresh');
        const btnCloseModal = document.getElementById('btnCloseModal');
        const btnCloseModal2 = document.getElementById('btnCloseModal2');
        const btnDownload = document.getElementById('btnDownload');
        const txtInternet = document.getElementById('txtInternet');
        const txtBattery = document.getElementById('txtBattery');
        const txtResolution = document.getElementById('txtResolution');
        const txtClock = document.getElementById('txtClock');
        const txtDate = document.getElementById('txtDate');
        const txtTime = document.getElementById('txtTime');
        const txtLat = document.getElementById('txtLat');
        const txtLon = document.getElementById('txtLon');
        const txtAccuracy = document.getElementById('txtAccuracy');
        const txtLocationName = document.getElementById('txtLocationName');
        const miniMapWrapper = document.getElementById('miniMapWrapper');
        const miniMapContainer = document.getElementById('miniMapContainer');

        let currentStream = null;
        let currentFacingMode = 'environment';
        let hasMultipleCameras = false;
        let videoTrackSettings = null;
        let miniMapInstance = null;
        let miniMapMarker = null;
        let lastLatitude = null, lastLongitude = null, lastAccuracy = null;
        let gpsWatchId = null, gpsStatus = 'searching';
        let lastCapturedDataUrl = null;
        let batteryLevel = null, isBatteryLow = false;
        let lastGeocodeFetch = 0;

        const chipGpsIndicator = document.createElement('span');
        chipGpsIndicator.className = 'status-chip gps-searching';
        chipGpsIndicator.innerHTML = '<i class="fa-solid fa-satellite"></i> <span id="txtGpsStatus">Mencari</span>';
        document.getElementById('statusBarTop').appendChild(chipGpsIndicator);
        const txtGpsStatus = document.getElementById('txtGpsStatus');

        function formatDateID(d) { const days=['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu']; const months=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember']; return `${days[d.getDay()]}, ${d.getDate()} ${months[d.getMonth()]} ${d.getFullYear()}`; }
        function formatTimeID(d) { return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}:${String(d.getSeconds()).padStart(2,'0')}`; }
        function formatDateTimeCompact(d) { return `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}_${String(d.getHours()).padStart(2,'0')}${String(d.getMinutes()).padStart(2,'0')}${String(d.getSeconds()).padStart(2,'0')}`; }

        function updateClock() { const now=new Date(); txtClock.textContent=formatTimeID(now); txtDate.textContent=formatDateID(now); txtTime.textContent=formatTimeID(now)+' WIB'; }
        updateClock(); setInterval(updateClock,1000);

        function updateInternetStatus() { const online=navigator.onLine; document.getElementById('chipInternet').className=`status-chip ${online?'online':'offline'}`; txtInternet.textContent=online?'Online':'Offline'; }
        updateInternetStatus(); window.addEventListener('online',updateInternetStatus); window.addEventListener('offline',updateInternetStatus);

        async function initBattery() { try { if(navigator.getBattery){ const b=await navigator.getBattery(); batteryLevel=b.level; isBatteryLow=b.level<0.2; updateBatteryUI(); b.addEventListener('levelchange',()=>{ batteryLevel=b.level; isBatteryLow=b.level<0.2; updateBatteryUI(); }); } } catch(e){} }
        function updateBatteryUI() { if(batteryLevel===null) return; const pct=Math.round(batteryLevel*100); txtBattery.textContent=pct+'%'; const chip=document.getElementById('chipBattery'); chip.className=`status-chip ${isBatteryLow?'battery-low':'battery'}`; }
        initBattery();

        async function initCamera(facing='environment') {
            try {
                if(currentStream) currentStream.getTracks().forEach(t=>t.stop());
                const stream = await navigator.mediaDevices.getUserMedia({ video:{facingMode:facing, width:{ideal:1920}, height:{ideal:1080}}, audio:false });
                cameraVideo.srcObject = stream;
                currentStream = stream;
                currentFacingMode = facing;
                cameraVideo.classList.toggle('front-facing', facing==='user');
                const track = stream.getVideoTracks()[0];
                if(track) { videoTrackSettings = track.getSettings(); txtResolution.textContent = `${videoTrackSettings.width||'?'}x${videoTrackSettings.height||'?'}`; }
                await checkMultipleCameras();
                cameraError.classList.remove('visible');
            } catch(e) { cameraError.classList.add('visible'); }
        }

        async function checkMultipleCameras() {
            const devices = await navigator.mediaDevices.enumerateDevices();
            hasMultipleCameras = devices.filter(d=>d.kind==='videoinput').length>1;
            btnSwitchCamera.style.opacity = hasMultipleCameras?'1':'0.35';
            btnSwitchCamera.style.pointerEvents = hasMultipleCameras?'auto':'none';
        }

        function switchCamera() { if(!hasMultipleCameras) return; initCamera(currentFacingMode==='environment'?'user':'environment'); }

        function initGPS() {
            if(!navigator.geolocation) { gpsStatus='unavailable'; updateGpsUI(); return; }
            gpsStatus='searching'; updateGpsUI();
            if(gpsWatchId) navigator.geolocation.clearWatch(gpsWatchId);
            gpsWatchId = navigator.geolocation.watchPosition(pos=>{
                gpsStatus='active'; updateGpsUI();
                lastLatitude=pos.coords.latitude; lastLongitude=pos.coords.longitude; lastAccuracy=pos.coords.accuracy;
                txtLat.textContent=lastLatitude.toFixed(6)+'°'; txtLon.textContent=lastLongitude.toFixed(6)+'°'; txtAccuracy.textContent='±'+Math.round(lastAccuracy)+'m';
                updateMiniMap(lastLatitude,lastLongitude,lastAccuracy);
                if(Date.now()-lastGeocodeFetch>5000) { lastGeocodeFetch=Date.now(); fetchLocationName(lastLatitude,lastLongitude); }
            }, err=>{ gpsStatus=err.code===1?'denied':'searching'; updateGpsUI(); txtLocationName.textContent=err.code===1?'GPS: Izin ditolak':'GPS: Mencari...'; }, {enableHighAccuracy:true,timeout:15000,maximumAge:2000});
        }

        function updateGpsUI() {
            chipGpsIndicator.classList.remove('gps-active','gps-searching','gps-denied');
            if(gpsStatus==='active') { chipGpsIndicator.classList.add('gps-active'); txtGpsStatus.textContent='Aktif'; }
            else if(gpsStatus==='denied') { chipGpsIndicator.classList.add('gps-denied'); txtGpsStatus.textContent='Ditolak'; }
            else { chipGpsIndicator.classList.add('gps-searching'); txtGpsStatus.textContent='Mencari'; }
        }

        function refreshGps() { if(gpsWatchId) navigator.geolocation.clearWatch(gpsWatchId); gpsWatchId=null; gpsStatus='searching'; updateGpsUI(); lastGeocodeFetch=0; initGPS(); }

        async function fetchLocationName(lat,lon) {
            try {
                const resp = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}&zoom=16&accept-language=id`);
                const data = await resp.json();
                const name = data?.address?.road || data?.address?.neighbourhood || data?.address?.suburb || data?.display_name?.split(',')[0] || 'Lokasi tidak dikenal';
                txtLocationName.textContent = name;
            } catch(e) { txtLocationName.textContent = 'Lokasi (terbatas)'; }
        }

        function initMiniMap(lat,lon) {
            if(miniMapInstance) return;
            try {
                miniMapInstance = L.map(miniMapContainer, {center:[lat,lon],zoom:17,zoomControl:false,dragging:false,attributionControl:false});
                L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',{subdomains:'abcd'}).addTo(miniMapInstance);
                miniMapMarker = L.marker([lat,lon],{icon:L.divIcon({className:'',html:'<div style="width:14px;height:14px;background:#5b9bd5;border:2px solid #fff;border-radius:50%;box-shadow:0 0 10px rgba(91,155,213,0.7);"></div>',iconSize:[14,14],iconAnchor:[7,7]})}).addTo(miniMapInstance);
                miniMapWrapper.classList.remove('loading');
            } catch(e) { miniMapWrapper.style.display='none'; }
        }

        function updateMiniMap(lat,lon,acc) {
            if(!miniMapInstance) { initMiniMap(lat,lon); return; }
            miniMapInstance.setView([lat,lon], miniMapInstance.getZoom(), {animate:true});
            if(miniMapMarker) miniMapMarker.setLatLng([lat,lon]);
            miniMapInstance.eachLayer(l=>{ if(l instanceof L.Circle) miniMapInstance.removeLayer(l); });
            if(acc && acc<200) L.circle([lat,lon],{radius:acc,color:'#5b9bd5',fillOpacity:0.12,weight:1}).addTo(miniMapInstance);
        }

        function capturePhoto() {
            if (!currentStream || cameraVideo.readyState < 2) { alert('Kamera belum siap.'); return; }
            const videoWidth = cameraVideo.videoWidth;
            const videoHeight = cameraVideo.videoHeight;
            captureCanvas.width = videoWidth;
            captureCanvas.height = videoHeight;

            if (currentFacingMode === 'user') {
                ctx.save(); ctx.translate(videoWidth, 0); ctx.scale(-1, 1);
                ctx.drawImage(cameraVideo, 0, 0, videoWidth, videoHeight);
                ctx.restore();
            } else {
                ctx.drawImage(cameraVideo, 0, 0, videoWidth, videoHeight);
            }

            const now = new Date();
            const dateStr = formatDateID(now);
            const timeStr = formatTimeID(now) + ' WIB';
            const gpsStr = (lastLatitude!==null) ? `${lastLatitude.toFixed(6)}, ${lastLongitude.toFixed(6)} | ±${Math.round(lastAccuracy||0)}m` : '📍 GPS: --';
            const locationName = txtLocationName.textContent || 'Lokasi tidak diketahui';

            const baseFont = Math.max(18, Math.round(videoWidth * 0.025));
            const smallFont = Math.round(baseFont * 0.75);
            const largeFont = Math.round(baseFont * 1.2);
            const pad = Math.round(videoWidth * 0.035);
            const lineH = Math.round(baseFont * 1.7);
            const lines = [
                { text: '📷 GeoTime Camera', font: `bold ${largeFont}px "Inter", sans-serif`, color: '#ffffff' },
                { text: `📅 ${dateStr}  ⏱ ${timeStr}`, font: `${baseFont}px "Inter", sans-serif`, color: '#e0e0e0' },
                { text: `🛰️ ${gpsStr}`, font: `${smallFont}px "Inter", sans-serif`, color: '#cccccc' },
                { text: `📍 ${locationName}`, font: `${smallFont}px "Inter", sans-serif`, color: '#cccccc' }
            ];
            const totalH = lines.length * lineH;
            const boxH = totalH + pad * 2;
            const boxY = videoHeight - boxH - Math.round(videoHeight * 0.02);

            ctx.save();
            ctx.shadowColor = 'rgba(0,0,0,0.7)'; ctx.shadowBlur = 15;
            ctx.fillStyle = 'rgba(0, 0, 0, 0.75)';
            ctx.fillRect(0, boxY, videoWidth, boxH);
            ctx.restore();

            ctx.fillStyle = '#5b9bd5'; ctx.fillRect(0, boxY, videoWidth, 3);

            ctx.textBaseline = 'middle';
            lines.forEach((line, i) => {
                ctx.fillStyle = line.color;
                ctx.font = line.font;
                ctx.fillText(line.text, pad, boxY + pad + lineH * i + lineH/2);
            });

            lastCapturedDataUrl = captureCanvas.toDataURL('image/jpeg', 0.95);
            showPreview(lastCapturedDataUrl);
        }

        function showPreview(url) { modalImage.src=url; modalOverlay.classList.add('active'); }
        function hidePreview() { modalOverlay.classList.remove('active'); setTimeout(()=>{ if(!modalOverlay.classList.contains('active')) modalImage.src=''; },400); }
        function downloadPhoto() { if(!lastCapturedDataUrl) return; const a=document.createElement('a'); a.href=lastCapturedDataUrl; a.download=`GeoTime_${formatDateTimeCompact(new Date())}.jpg`; a.click(); }

        btnCapture.addEventListener('click', ()=>{ btnCapture.style.transform='scale(0.85)'; setTimeout(()=>btnCapture.style.transform='',150); capturePhoto(); });
        btnSwitchCamera.addEventListener('click', switchCamera);
        btnGpsRefresh.addEventListener('click', refreshGps);
        btnCloseModal.addEventListener('click', hidePreview);
        btnCloseModal2.addEventListener('click', hidePreview);
        btnDownload.addEventListener('click', downloadPhoto);
        modalOverlay.addEventListener('click', e=>{ if(e.target===modalOverlay) hidePreview(); });
        document.addEventListener('keydown', e=>{ if(e.key==='Escape' && modalOverlay.classList.contains('active')) hidePreview(); if(e.key===' ' && !modalOverlay.classList.contains('active')) { e.preventDefault(); capturePhoto(); } });

        document.addEventListener('visibilitychange', ()=>{
            if(document.hidden && gpsWatchId) { navigator.geolocation.clearWatch(gpsWatchId); gpsWatchId=null; gpsStatus='searching'; updateGpsUI(); }
            else if(!document.hidden && !gpsWatchId && gpsStatus!=='denied') initGPS();
        });

        initCamera('environment');
        initGPS();
    })();
</script>
</body>
