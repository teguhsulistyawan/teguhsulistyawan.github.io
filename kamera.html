<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>GeoTime Camera</title>
    <!-- Font Awesome & Leaflet -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root {
            --bg-glass: rgba(18,18,18,0.55);
            --accent: #5b9bd5;
            --accent-soft: rgba(91,155,213,0.5);
            --border-glass: rgba(255,255,255,0.1);
            --border-glass-strong: rgba(255,255,255,0.18);
            --shadow-md: 0 4px 20px rgba(0,0,0,0.5);
            --shadow-lg: 0 8px 40px rgba(0,0,0,0.6);
            --radius-md: 16px;
            --radius-lg: 24px;
            --radius-full: 50%;
            --transition-fast: 0.2s cubic-bezier(0.4,0,0.2,1);
            --transition-smooth: 0.35s cubic-bezier(0.4,0,0.2,1);
            --font-mono: 'SF Mono','Cascadia Code','Consolas','Monaco',monospace;
            --font-sans: 'Inter','SF Pro Display',system-ui,-apple-system,sans-serif;
        }
        * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; }
        html,body { width:100%; height:100%; overflow:hidden; background:#000; font-family:var(--font-sans); touch-action:manipulation; position:fixed; top:0; left:0; }
        .app-container { position:relative; width:100%; height:100%; overflow:hidden; background:#000; }
        .camera-video { position:absolute; top:0; left:0; width:100%; height:100%; object-fit:cover; z-index:1; transform:scaleX(1); transition:transform var(--transition-smooth); }
        .camera-video.front-facing { transform:scaleX(-1); }
        .dark-overlay { position:absolute; inset:0; z-index:2; pointer-events:none; background:radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.15) 70%, rgba(0,0,0,0.35) 100%); }
        .status-bar-top { position:absolute; top:16px; left:16px; z-index:10; display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
        .status-chip { display:flex; align-items:center; gap:5px; padding:6px 10px; font-size:10px; font-weight:500; color:rgba(255,255,255,0.88); background:var(--bg-glass); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px); border:1px solid var(--border-glass); border-radius:20px; white-space:nowrap; box-shadow:var(--shadow-md); }
        .status-chip i { font-size:9px; color:var(--accent); }
        .status-chip.online i { color:#4caf84; } .status-chip.offline i { color:#e57373; }
        .mini-map-wrapper { position:absolute; top:16px; right:16px; z-index:10; width:140px; height:140px; border-radius:var(--radius-md); overflow:hidden; border:1.5px solid var(--border-glass-strong); box-shadow:var(--shadow-md); background:#1a1a1a; backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); }
        .mini-map-container { width:100%; height:100%; border-radius:var(--radius-md); }
        .leaflet-control-zoom,.leaflet-control-attribution { display:none!important; }
        .timestamp-panel { position:absolute; bottom:130px; left:16px; z-index:10; padding:12px 15px; background:var(--bg-glass); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px); border:1px solid var(--border-glass); border-radius:var(--radius-md); box-shadow:var(--shadow-md); display:flex; flex-direction:column; gap:5px; max-width:220px; }
        .timestamp-row { display:flex; align-items:center; gap:7px; font-size:11px; color:rgba(255,255,255,0.88); }
        .timestamp-row i { font-size:9px; width:14px; text-align:center; color:var(--accent); }
        .timestamp-app-name { font-size:9px; color:rgba(255,255,255,0.55); letter-spacing:1.2px; margin-top:2px; font-weight:600; }
        .bottom-controls { position:absolute; bottom:28px; left:50%; transform:translateX(-50%); z-index:10; display:flex; align-items:center; gap:22px; padding:14px 24px; background:var(--bg-glass); backdrop-filter:blur(24px); -webkit-backdrop-filter:blur(24px); border:1px solid var(--border-glass); border-radius:40px; box-shadow:var(--shadow-lg); }
        .btn-capture { width:72px; height:72px; border-radius:var(--radius-full); background:transparent; border:4px solid rgba(255,255,255,0.85); cursor:pointer; position:relative; transition:all var(--transition-fast); outline:none; display:flex; align-items:center; justify-content:center; animation:capture-pulse 3s ease-in-out infinite; }
        .btn-capture::after { content:''; position:absolute; inset:8px; border-radius:var(--radius-full); background:rgba(255,255,255,0.9); transition:all var(--transition-fast); }
        .btn-capture:active { transform:scale(0.9); border-color:var(--accent); box-shadow:0 0 30px var(--accent-soft); }
        @keyframes capture-pulse { 0%,100%{box-shadow:0 0 0 0 rgba(255,255,255,0.2)} 50%{box-shadow:0 0 0 14px rgba(255,255,255,0)} }
        .btn-small { width:44px; height:44px; border-radius:var(--radius-full); background:rgba(255,255,255,0.08); border:1px solid var(--border-glass-strong); color:white; font-size:16px; display:flex; align-items:center; justify-content:center; cursor:pointer; transition:all var(--transition-fast); outline:none; backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); }
        .btn-small:active { background:rgba(255,255,255,0.2); transform:scale(0.88); border-color:var(--accent-soft); }
        .modal-overlay { position:fixed; inset:0; z-index:100; background:rgba(0,0,0,0.88); backdrop-filter:blur(20px); display:flex; align-items:center; justify-content:center; opacity:0; pointer-events:none; transition:opacity var(--transition-smooth); }
        .modal-overlay.active { opacity:1; pointer-events:auto; }
        .modal-content { position:relative; max-width:92vw; max-height:85vh; border-radius:var(--radius-lg); overflow:hidden; box-shadow:var(--shadow-lg); border:1px solid var(--border-glass-strong); transform:scale(0.9); transition:transform var(--transition-smooth); background:#111; }
        .modal-overlay.active .modal-content { transform:scale(1); }
        .modal-content img { display:block; max-width:100%; max-height:75vh; object-fit:contain; border-radius:var(--radius-lg) var(--radius-lg) 0 0; }
        .modal-actions { display:flex; gap:12px; padding:14px 20px; background:rgba(20,20,20,0.9); backdrop-filter:blur(12px); justify-content:center; border-top:1px solid var(--border-glass); }
        .btn-modal { padding:10px 20px; border-radius:25px; border:1px solid var(--border-glass-strong); background:rgba(255,255,255,0.06); color:white; cursor:pointer; font-size:13px; display:flex; align-items:center; gap:7px; transition:all var(--transition-fast); outline:none; }
        .btn-modal:active { background:rgba(255,255,255,0.14); }
        .btn-modal.download-btn { background:var(--accent); border-color:var(--accent); font-weight:600; }
        .btn-close-modal { position:absolute; top:12px; right:12px; width:36px; height:36px; border-radius:50%; background:rgba(0,0,0,0.6); border:1px solid var(--border-glass-strong); color:white; cursor:pointer; z-index:5; display:flex; align-items:center; justify-content:center; font-size:14px; transition:all var(--transition-fast); }
        .camera-error { position:absolute; inset:0; z-index:20; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:12px; color:white; background:rgba(0,0,0,0.9); opacity:0; pointer-events:none; transition:opacity var(--transition-smooth); }
        .camera-error.visible { opacity:1; pointer-events:auto; }
        @media (max-width:400px) {
            .timestamp-panel { bottom:115px; left:8px; padding:10px 12px; max-width:185px; }
            .mini-map-wrapper { width:110px; height:110px; top:10px; right:10px; }
            .bottom-controls { gap:16px; padding:10px 18px; bottom:20px; }
            .btn-capture { width:60px; height:60px; }
            .btn-small { width:38px; height:38px; }
        }
    </style>
</head>
<body>
<div class="app-container" id="appContainer">
    <video class="camera-video" id="cameraVideo" autoplay playsinline muted></video>
    <div class="dark-overlay"></div>
    <div class="status-bar-top" id="statusBarTop">
        <span class="status-chip online" id="chipInternet"><i class="fa-solid fa-wifi"></i> <span id="txtInternet">Online</span></span>
        <span class="status-chip" id="chipBattery"><i class="fa-solid fa-battery-full"></i> <span id="txtBattery">--</span></span>
        <span class="status-chip" id="chipResolution"><i class="fa-solid fa-video"></i> <span id="txtResolution">--</span></span>
        <span class="status-chip" id="chipClock"><i class="fa-regular fa-clock"></i> <span id="txtClock">--:--:--</span></span>
    </div>
    <div class="mini-map-wrapper loading" id="miniMapWrapper"><div class="mini-map-container" id="miniMapContainer"></div></div>
    <div class="timestamp-panel">
        <div class="timestamp-row"><i class="fa-regular fa-calendar"></i><span class="value" id="txtDate">--</span></div>
        <div class="timestamp-row"><i class="fa-regular fa-clock"></i><span class="value" id="txtTime">--:--:--</span></div>
        <div class="timestamp-row"><i class="fa-solid fa-location-dot"></i><span class="value" id="txtLat">--</span></div>
        <div class="timestamp-row"><i class="fa-solid fa-location-dot"></i><span class="value" id="txtLon">--</span></div>
        <div class="timestamp-row"><i class="fa-solid fa-crosshairs"></i><span class="value" id="txtAccuracy">--</span></div>
        <div class="timestamp-location-name" id="txtLocationName" style="font-size:10px;color:rgba(255,255,255,0.7);">Mendapatkan lokasi...</div>
        <div class="timestamp-app-name">GeoTime Camera</div>
    </div>
    <div class="bottom-controls">
        <button class="btn-small" id="btnSwitchCamera"><i class="fa-solid fa-camera-rotate"></i></button>
        <button class="btn-capture" id="btnCapture"></button>
        <button class="btn-small" id="btnGpsRefresh"><i class="fa-solid fa-location-crosshairs"></i></button>
    </div>
    <canvas class="capture-canvas" id="captureCanvas"></canvas>
    <div class="camera-error" id="cameraError"><i class="fa-solid fa-video-slash"></i><p>Tidak dapat mengakses kamera.</p></div>
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-content">
            <button class="btn-close-modal" id="btnCloseModal"><i class="fa-solid fa-xmark"></i></button>
            <img id="modalImage" src="" alt="Hasil Capture" />
            <div class="modal-actions">
                <button class="btn-modal" id="btnCloseModal2"><i class="fa-solid fa-xmark"></i> Tutup</button>
                <button class="btn-modal download-btn" id="btnDownload"><i class="fa-solid fa-download"></i> Simpan Foto</button>
            </div>
        </div>
    </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<!-- html2canvas untuk menangkap peta mini -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
    (() => {
        // DOM
        const cameraVideo = document.getElementById('cameraVideo');
        const captureCanvas = document.getElementById('captureCanvas');
        const ctx = captureCanvas.getContext('2d');
        const modalOverlay = document.getElementById('modalOverlay');
        const modalImage = document.getElementById('modalImage');
        const cameraError = document.getElementById('cameraError');
        const btnCapture = document.getElementById('btnCapture');
        const btnSwitchCamera = document.getElementById('btnSwitchCamera');
        const btnGpsRefresh = document.getElementById('btnGpsRefresh');
        const btnCloseModal = document.getElementById('btnCloseModal');
        const btnCloseModal2 = document.getElementById('btnCloseModal2');
        const btnDownload = document.getElementById('btnDownload');
        const txtInternet = document.getElementById('txtInternet');
        const txtBattery = document.getElementById('txtBattery');
        const txtResolution = document.getElementById('txtResolution');
        const txtClock = document.getElementById('txtClock');
        const txtDate = document.getElementById('txtDate');
        const txtTime = document.getElementById('txtTime');
        const txtLat = document.getElementById('txtLat');
        const txtLon = document.getElementById('txtLon');
        const txtAccuracy = document.getElementById('txtAccuracy');
        const txtLocationName = document.getElementById('txtLocationName');
        const miniMapWrapper = document.getElementById('miniMapWrapper');
        const miniMapContainer = document.getElementById('miniMapContainer');

        let currentStream = null, currentFacingMode = 'environment', hasMultipleCameras = false;
        let videoTrackSettings = null, miniMapInstance = null, miniMapMarker = null;
        let lastLatitude = null, lastLongitude = null, lastAccuracy = null;
        let gpsWatchId = null, gpsStatus = 'searching', lastCapturedDataUrl = null;
        let batteryLevel = null, isBatteryLow = false, lastGeocodeFetch = 0;

        // GPS chip
        const chipGps = document.createElement('span');
        chipGps.className = 'status-chip gps-searching';
        chipGps.innerHTML = '<i class="fa-solid fa-satellite"></i> <span id="txtGpsStatus">Mencari</span>';
        document.getElementById('statusBarTop').appendChild(chipGps);
        const txtGpsStatus = document.getElementById('txtGpsStatus');

        // Format tanggal/jam
        const formatDate = d => `${['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'][d.getDay()]}, ${d.getDate()} ${['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'][d.getMonth()]} ${d.getFullYear()}`;
        const formatTime = d => `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}:${String(d.getSeconds()).padStart(2,'0')}`;
        const compactDateTime = d => `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}_${String(d.getHours()).padStart(2,'0')}${String(d.getMinutes()).padStart(2,'0')}${String(d.getSeconds()).padStart(2,'0')}`;

        function updateClock() { const n=new Date(); txtClock.textContent=formatTime(n); txtDate.textContent=formatDate(n); txtTime.textContent=formatTime(n)+' WIB'; }
        updateClock(); setInterval(updateClock,1000);

        function updateInternet() { const on=navigator.onLine; document.getElementById('chipInternet').className=`status-chip ${on?'online':'offline'}`; txtInternet.textContent=on?'Online':'Offline'; }
        updateInternet(); window.addEventListener('online',updateInternet); window.addEventListener('offline',updateInternet);

        async function initBattery() {
            if(!navigator.getBattery) return;
            const b=await navigator.getBattery();
            batteryLevel=b.level; isBatteryLow=b.level<0.2; updateBatteryUI();
            b.addEventListener('levelchange',()=>{ batteryLevel=b.level; isBatteryLow=b.level<0.2; updateBatteryUI(); });
        }
        function updateBatteryUI() {
            if(batteryLevel===null) return;
            const pct=Math.round(batteryLevel*100);
            txtBattery.textContent=pct+'%';
            document.getElementById('chipBattery').className=`status-chip ${isBatteryLow?'battery-low':'battery'}`;
        }
        initBattery();

        async function initCamera(facing='environment') {
            try {
                if(currentStream) currentStream.getTracks().forEach(t=>t.stop());
                currentStream = await navigator.mediaDevices.getUserMedia({ video:{facingMode:facing, width:{ideal:1920}, height:{ideal:1080}} });
                cameraVideo.srcObject = currentStream;
                currentFacingMode = facing;
                cameraVideo.classList.toggle('front-facing', facing==='user');
                const track = currentStream.getVideoTracks()[0];
                if(track) { videoTrackSettings = track.getSettings(); txtResolution.textContent = `${videoTrackSettings.width||'?'}x${videoTrackSettings.height||'?'}`; }
                await checkCameras();
                cameraError.classList.remove('visible');
            } catch(e) { cameraError.classList.add('visible'); }
        }
        async function checkCameras() {
            const devices = await navigator.mediaDevices.enumerateDevices();
            hasMultipleCameras = devices.filter(d=>d.kind==='videoinput').length>1;
            btnSwitchCamera.style.opacity = hasMultipleCameras?'1':'0.35';
            btnSwitchCamera.style.pointerEvents = hasMultipleCameras?'auto':'none';
        }
        function switchCamera() { if(hasMultipleCameras) initCamera(currentFacingMode==='environment'?'user':'environment'); }

        // GPS
        function initGPS() {
            if(!navigator.geolocation) { gpsStatus='unavailable'; updateGpsUI(); return; }
            gpsStatus='searching'; updateGpsUI();
            if(gpsWatchId) navigator.geolocation.clearWatch(gpsWatchId);
            gpsWatchId = navigator.geolocation.watchPosition(pos => {
                gpsStatus='active'; updateGpsUI();
                lastLatitude=pos.coords.latitude; lastLongitude=pos.coords.longitude; lastAccuracy=pos.coords.accuracy;
                txtLat.textContent=lastLatitude.toFixed(6)+'°'; txtLon.textContent=lastLongitude.toFixed(6)+'°'; txtAccuracy.textContent='±'+Math.round(lastAccuracy)+'m';
                updateMiniMap(lastLatitude,lastLongitude,lastAccuracy);
                if(Date.now()-lastGeocodeFetch>5000) { lastGeocodeFetch=Date.now(); fetchLocationName(lastLatitude,lastLongitude); }
            }, err => {
                gpsStatus = err.code===1?'denied':'searching'; updateGpsUI();
                txtLocationName.textContent = err.code===1?'GPS: Izin ditolak':'GPS: Mencari...';
            }, { enableHighAccuracy:true, timeout:15000, maximumAge:2000 });
        }
        function updateGpsUI() {
            chipGps.classList.remove('gps-active','gps-searching','gps-denied');
            if(gpsStatus==='active') { chipGps.classList.add('gps-active'); txtGpsStatus.textContent='Aktif'; }
            else if(gpsStatus==='denied') { chipGps.classList.add('gps-denied'); txtGpsStatus.textContent='Ditolak'; }
            else { chipGps.classList.add('gps-searching'); txtGpsStatus.textContent='Mencari'; }
        }
        function refreshGps() { if(gpsWatchId) { navigator.geolocation.clearWatch(gpsWatchId); gpsWatchId=null; } gpsStatus='searching'; updateGpsUI(); lastGeocodeFetch=0; initGPS(); }
        async function fetchLocationName(lat,lon) {
            try {
                const r=await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}&zoom=16&accept-language=id`);
                const d=await r.json();
                txtLocationName.textContent = d?.address?.road || d?.address?.neighbourhood || d?.address?.suburb || d?.display_name?.split(',')[0] || 'Lokasi tidak dikenal';
            } catch(e) { txtLocationName.textContent='Lokasi (terbatas)'; }
        }

        // Mini map Leaflet
        function initMiniMap(lat,lon) {
            if(miniMapInstance) return;
            try {
                miniMapInstance = L.map(miniMapContainer, { center:[lat,lon], zoom:17, zoomControl:false, dragging:false, attributionControl:false });
                L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',{subdomains:'abcd'}).addTo(miniMapInstance);
                miniMapMarker = L.marker([lat,lon],{icon:L.divIcon({html:'<div style="width:14px;height:14px;background:#5b9bd5;border:2px solid white;border-radius:50%;box-shadow:0 0 10px rgba(91,155,213,0.7);"></div>',iconSize:[14,14],iconAnchor:[7,7]})}).addTo(miniMapInstance);
                miniMapWrapper.classList.remove('loading');
            } catch(e) { miniMapWrapper.style.display='none'; }
        }
        function updateMiniMap(lat,lon,acc) {
            if(!miniMapInstance) { initMiniMap(lat,lon); return; }
            miniMapInstance.setView([lat,lon], miniMapInstance.getZoom(), {animate:true});
            if(miniMapMarker) miniMapMarker.setLatLng([lat,lon]);
            miniMapInstance.eachLayer(l=>{ if(l instanceof L.Circle) miniMapInstance.removeLayer(l); });
            if(acc && acc<200) L.circle([lat,lon],{radius:acc,color:'#5b9bd5',fillOpacity:0.1,weight:1}).addTo(miniMapInstance);
        }

        // Fungsi bantu: rounded rect
        function drawRoundedRect(ctx, x, y, w, h, r) {
            ctx.beginPath();
            ctx.moveTo(x+r, y); ctx.lineTo(x+w-r, y); ctx.quadraticCurveTo(x+w, y, x+w, y+r);
            ctx.lineTo(x+w, y+h-r); ctx.quadraticCurveTo(x+w, y+h, x+w-r, y+h);
            ctx.lineTo(x+r, y+h); ctx.quadraticCurveTo(x, y+h, x, y+h-r);
            ctx.lineTo(x, y+r); ctx.quadraticCurveTo(x, y, x+r, y);
            ctx.closePath();
        }

        // Capture profesional dengan peta mini + ikon Font Awesome
        async function capturePhoto() {
            if (!currentStream || cameraVideo.readyState < 2) { alert('Kamera belum siap.'); return; }
            const vw = cameraVideo.videoWidth;
            const vh = cameraVideo.videoHeight;
            captureCanvas.width = vw;
            captureCanvas.height = vh;

            // 1. Gambar video (flip jika depan)
            if (currentFacingMode === 'user') {
                ctx.save(); ctx.translate(vw, 0); ctx.scale(-1, 1);
                ctx.drawImage(cameraVideo, 0, 0, vw, vh);
                ctx.restore();
            } else {
                ctx.drawImage(cameraVideo, 0, 0, vw, vh);
            }

            // 2. Ambil snapshot peta mini
            if (miniMapWrapper.style.display !== 'none' && miniMapContainer) {
                try {
                    const mapCanvas = await html2canvas(miniMapContainer, {
                        useCORS: true,
                        scale: 1,
                        backgroundColor: null,
                        allowTaint: false,
                        logging: false
                    });
                    const mapSize = Math.min(vw * 0.2, 180);
                    const mapX = vw - mapSize - 25;
                    const mapY = vh - mapSize - 25;
                    ctx.save();
                    drawRoundedRect(ctx, mapX-2, mapY-2, mapSize+4, mapSize+4, 14);
                    ctx.fillStyle = '#ffffff';
                    ctx.fill();
                    ctx.clip();
                    drawRoundedRect(ctx, mapX, mapY, mapSize, mapSize, 12);
                    ctx.clip();
                    ctx.drawImage(mapCanvas, mapX, mapY, mapSize, mapSize);
                    ctx.restore();
                } catch(e) { console.warn('Gagal menangkap peta', e); }
            }

            // 3. Watermark dengan Font Awesome & latar transparan modern
            const now = new Date();
            const dateStr = formatDate(now);
            const timeStr = formatTime(now) + ' WIB';
            const gpsStr = (lastLatitude!==null) ? `${lastLatitude.toFixed(6)}, ${lastLongitude.toFixed(6)}  ±${Math.round(lastAccuracy||0)}m` : 'GPS tidak tersedia';
            const location = txtLocationName.textContent || 'Lokasi tidak diketahui';

            // Ukuran font proporsional
            const base = Math.max(16, Math.round(vw * 0.022));
            const large = base * 1.25;
            const small = base * 0.8;
            const padX = Math.round(vw * 0.04);
            const padY = Math.round(vh * 0.03);
            const lineH = Math.round(base * 1.8);

            // Kotak latar transparan (hanya di kiri bawah)
            const boxW = Math.min(vw * 0.65, 650);
            const linesCount = 4;
            const boxH = linesCount * lineH + padY * 2;
            const boxX = padX;
            const boxY = vh - boxH - padY;

            // Latar belakang semi-transparan dengan efek kaca
            ctx.save();
            ctx.shadowColor = 'rgba(0,0,0,0.4)'; ctx.shadowBlur = 20;
            ctx.fillStyle = 'rgba(10, 10, 10, 0.55)';
            drawRoundedRect(ctx, boxX, boxY, boxW, boxH, 18);
            ctx.fill();
            ctx.restore();

            // Garis aksen vertikal di kiri
            ctx.fillStyle = '#5b9bd5';
            ctx.fillRect(boxX, boxY + 10, 3, boxH - 20);

            // Ikon Font Awesome (gunakan karakter unicode & pastikan font tersedia)
            const faFont = `900 ${base}px "Font Awesome 6 Free", "FontAwesome", sans-serif`;
            const textFont = `500 ${base}px "Inter", "SF Pro Display", sans-serif`;
            const smallFont = `400 ${small}px "Inter", sans-serif`;

            const drawRow = (iconCode, label, x, y, fontIcon, fontText) => {
                ctx.font = fontIcon;
                ctx.fillStyle = '#ffffff';
                ctx.fillText(iconCode, x, y);
                ctx.font = fontText;
                ctx.fillStyle = '#f0f0f0';
                ctx.fillText(label, x + base + 10, y);
            };

            const startY = boxY + padY + lineH/2;
            drawRow('\uf030', 'GeoTime Camera', boxX + padX, startY, faFont, `bold ${large}px "Inter", sans-serif`);
            drawRow('\uf133', `${dateStr}  \uf017 ${timeStr}`, boxX + padX, startY + lineH, faFont, textFont);
            drawRow('\uf7bf', `🛰️ ${gpsStr}`, boxX + padX, startY + lineH*2, faFont, smallFont);
            drawRow('\uf3c5', location, boxX + padX, startY + lineH*3, faFont, smallFont);

            // 4. Export & preview
            lastCapturedDataUrl = captureCanvas.toDataURL('image/jpeg', 0.95);
            showPreview(lastCapturedDataUrl);
        }

        function showPreview(url) { modalImage.src=url; modalOverlay.classList.add('active'); }
        function hidePreview() { modalOverlay.classList.remove('active'); setTimeout(()=>{ if(!modalOverlay.classList.contains('active')) modalImage.src=''; },400); }
        function downloadPhoto() {
            if(!lastCapturedDataUrl) return;
            const a=document.createElement('a');
            a.href=lastCapturedDataUrl;
            a.download=`GeoTime_${compactDateTime(new Date())}.jpg`;
            a.click();
        }

        // Event listeners
        btnCapture.addEventListener('click', ()=>{ btnCapture.style.transform='scale(0.85)'; setTimeout(()=>btnCapture.style.transform='',150); capturePhoto(); });
        btnSwitchCamera.addEventListener('click', switchCamera);
        btnGpsRefresh.addEventListener('click', refreshGps);
        btnCloseModal.addEventListener('click', hidePreview);
        btnCloseModal2.addEventListener('click', hidePreview);
        btnDownload.addEventListener('click', downloadPhoto);
        modalOverlay.addEventListener('click', e=>{ if(e.target===modalOverlay) hidePreview(); });
        document.addEventListener('keydown', e=>{
            if(e.key==='Escape' && modalOverlay.classList.contains('active')) hidePreview();
            if(e.key===' ' && !modalOverlay.classList.contains('active')) { e.preventDefault(); capturePhoto(); }
        });
        document.addEventListener('visibilitychange', ()=>{
            if(document.hidden && gpsWatchId) { navigator.geolocation.clearWatch(gpsWatchId); gpsWatchId=null; gpsStatus='searching'; updateGpsUI(); }
            else if(!document.hidden && !gpsWatchId && gpsStatus!=='denied') initGPS();
        });

        // Start
        initCamera('environment');
        initGPS();
    })();
</script>
</body>
</html>
