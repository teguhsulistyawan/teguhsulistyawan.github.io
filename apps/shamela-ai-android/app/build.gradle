plugins {
    id 'com.android.application'
}

android {
    namespace 'id.tsn.shamelaai'
    compileSdk 35

    defaultConfig {
        applicationId 'id.tsn.shamelaai'
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName '1.0.0'
    }

    buildTypes {
        debug {
            // Debug APK is automatically signed by Gradle and can be installed for personal use.
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
